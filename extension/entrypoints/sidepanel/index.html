<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BRIDGE</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1 id="title" tabindex="-1">BRIDGE</h1>
      <!-- The one live region (spec §6.6). Everything spoken goes through it. Visually
           hidden: announcements often repeat what the UI already shows (the scan summary),
           so rendering them printed the same sentence twice. -->
      <p id="live" class="vh" role="status" aria-live="polite"></p>
    </header>

    <main>
      <section>
        <h2 id="precheck-h">Application pre-check</h2>
        <p id="journey"></p>
        <p id="summary">Scanning the page…</p>
        <button type="button" id="rescan">Scan the page again</button>
        <button type="button" id="always-enable" hidden>Always enable BRIDGE on this site</button>
      </section>

      <section>
        <h2 id="questions-h">Questions</h2>
        <!-- Not a fieldset: a legend is spoken entering the group and again with each
             radio, and these two names need no context. Question groups keep theirs —
             there the group name IS the question. Same reason the sections above carry
             no aria-labelledby: a named region's name is read, then its heading repeats it. -->
        <div id="mode">
          <p class="group-name">How to answer</p>
          <label class="choice"><input type="radio" name="mode" value="one" checked> One question at a time</label>
          <label class="choice"><input type="radio" name="mode" value="list"> Full list</label>
        </div>
        <div id="questions"></div>
        <div id="pager">
          <button type="button" id="prev">Previous question</button>
          <button type="button" id="next">Next question</button>
        </div>
      </section>

      <section>
        <h2 id="verify-h">Check what the page contains</h2>
        <p>BRIDGE reads every answer back from the page itself, not from its own notes.</p>
        <button type="button" id="verify">Read back everything from the page</button>
        <ul id="verify-results"></ul>
        <button type="button" id="submit-app" hidden>Submit my application</button>
        <div id="submit-confirm" role="group" aria-labelledby="submit-question" hidden>
          <p id="submit-question"></p>
          <button type="button" id="submit-yes">Yes, submit now</button>
          <button type="button" id="submit-cancel">Cancel</button>
        </div>
      </section>

      <details id="diagnostics">
        <summary>Diagnostics</summary>
        <dl id="diag"></dl>
      </details>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
